name: CI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
    branches:
      - "main"
  pull_request:
  workflow_dispatch:
    inputs:
      github-hosted:
        description: Use GitHub runners even when SLINKY_RUNNER is set
        type: boolean
        default: false
      linux-arm64:
        description: Run only native Linux ARM64 race tests
        type: boolean
        default: false

# Boat's public-repository allowlist permits only owner-triggered runs.
# Dependabot PRs use GitHub runners even when the owner refreshes their branch.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.linux-arm64 && 'arm64' || 'checks' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: checks (${{ matrix.platform }})
    if: ${{ !inputs.linux-arm64 }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - macos
    runs-on: ${{ matrix.platform == 'macos' && 'macos-latest' || !inputs.github-hosted && github.ref_type != 'tag' && github.actor == github.repository_owner && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && vars.SLINKY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Match mise.toml and the Go version supported by golangci-lint 2.10.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - parallel:
          - name: golangci-lint
            uses: golangci/golangci-lint-action@v9
            with:
              version: v2.10
              only-new-issues: true
              args: --concurrency=2
            env:
              GOMAXPROCS: "2"
          # The race run executes the full suite; a plain run is redundant.
          - name: Go tests (race detector)
            run: go test -race ./...
            env:
              CGO_ENABLED: "1"
              GOMAXPROCS: "2"
      # Keep builds after the checks: GoReleaser's hooks run go mod tidy.
      # Its CGO_ENABLED=0 builds cover Linux and macOS, including ARM64.
      - uses: goreleaser/goreleaser-action@v7
        if: runner.os == 'Linux'
        with:
          version: "~> v2"
          args: build --clean --snapshot

  linux-arm64:
    name: Linux ARM64 tests
    if: github.event_name == 'workflow_dispatch' && inputs.linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  release:
    name: release
    needs: checks
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
