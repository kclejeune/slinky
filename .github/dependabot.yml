# Weekly Go batches, with a two-day minimum release age for patch/minor updates.
# Security updates bypass the version-update cooldown. Majors remain manual.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
      semver-patch-days: 2
      semver-minor-days: 2
      semver-major-days: 30
    groups:
      gomod:
        update-types:
          - "minor"
          - "patch"
